name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Auto Fix - Naya Android Folder Banao
        run: |
          ls -la
          if [ -f "girl-3d.zip" ]; then
            unzip -o girl-3d.zip
          fi
          # Project kahan hai?
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          ls -la
          # Purana Android Folder Backup karke Delete karo
          mv android android_old 2>/dev/null || true
          mv ios ios_old 2>/dev/null || true
          # Naya Android Folder Banao - Same Naam se
          flutter create . --platforms=android --org com.example --project-name ai_girl || flutter create . --platforms=android
          # Purani cheezein wapas lao - Agar thi to
          cp -r android_old/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true
          ls android/app/

      - name: Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          flutter clean
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"

name: Build 3D Girl + AI Chat APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'
      - name: Create Project
        run: |
          flutter create --project-name girl_3d --org com.girl3d . || true
          mkdir -p assets lib
          cp /tmp/keep_assets_girl.glb assets/girl.glb 2>/dev/null || echo "assets already have girl.glb"
      - name: Inject GROQ Key
        run: |
          sed -i "s/GROQ_API_KEY_PLACEHOLDER/${{ secrets.GROQ_API_KEY }}/g" lib/groq_service.dart || true
      - name: Setup Icon
        run: |
          python3 << 'PY'
          import pathlib, shutil
          src = pathlib.Path("assets/icon.png")
          if src.exists():
              for d in ["android/app/src/main/res/mipmap-hdpi","android/app/src/main/res/mipmap-mdpi","android/app/src/main/res/mipmap-xhdpi","android/app/src/main/res/mipmap-xxhdpi","android/app/src/main/res/mipmap-xxxhdpi"]:
                  pathlib.Path(d).mkdir(parents=True, exist_ok=True)
                  shutil.copy(str(src), f"{d}/ic_launcher.png")
                  shutil.copy(str(src), f"{d}/ic_launcher_round.png")
              print("Icon OK")
          PY
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: girl-3d-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Build
        run: |
          if [ -f "girl-3d.zip" ]; then unzip -o girl-3d.zip; fi
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -1))
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          rm -rf android ios
          flutter create . --platforms=android --org com.example --project-name ai_girl
          flutter clean
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ai-girl-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
